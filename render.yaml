# Render Blueprint: one web service + one PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick your GitHub repo. It reads this file.
# Secret values (API keys) are marked sync:false, so Render asks you for them once (paste from .env.render).
databases:
  - name: readywise-db
    databaseName: readywise
    user: readywise
    plan: free            # free databases expire after 30 days: change to basic-256mb (or higher) before launch day

services:
  - type: web
    name: readywise
    runtime: python
    plan: free            # change to starter to stop the service sleeping after 15 minutes idle
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: readywise-db
          property: connectionString
      - key: RESEARCH_IN_THREAD
        value: "1"
      - key: GROQ_RESEARCH_KEYS
        sync: false
      - key: GROQ_INTERVIEW_KEYS
        sync: false
      - key: FACTCHECK_GEMINI_KEYS
        sync: false
      - key: GROQ_FACTCHECK_KEYS
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: BACKUP_AI_BASE_URL
        sync: false
      - key: BACKUP_AI_KEYS
        sync: false
      - key: BACKUP_AI_MODELS
        sync: false
