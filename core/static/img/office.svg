<!-- centre wall: logo panel + art -->
<rect x="640" y="150" width="320" height="200" rx="6" fill="#2c3550"/><rect x="654" y="164" width="292" height="172" rx="3" fill="#36415f"/><circle cx="800" cy="236" r="30" fill="none" stroke="#9fb4ff" stroke-width="6"/><rect x="740" y="290" width="120" height="8" rx="4" fill="#9fb4ff" opacity=".7"/><rect x="760" y="306" width="80" height="6" rx="3" fill="#9fb4ff" opacity=".4"/>
