<g><rect x="90" y="110" width="470" height="430" rx="6" fill="#bdb4a5"/><rect x="104" y="124" width="442" height="402" fill="url(#sky)"/><g transform="translate(112 340)"><use href="#sk"/></g><g transform="translate(140 400) scale(.8)" opacity=".6"><use href="#sk"/></g><path d="M325 124V526M104 325H546" stroke="#bdb4a5" stroke-width="10"/><rect x="104" y="124" width="442" height="402" fill="url(#glow)" opacity=".35"/></g>
