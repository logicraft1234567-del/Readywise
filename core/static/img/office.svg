<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efeae2"/><stop offset="1" stop-color="#d9d2c6"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fc4ec"/><stop offset=".7" stop-color="#e9ddd0"/><stop offset="1" stop-color="#f4d9b8"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a4a"/><stop offset="1" stop-color="#5e4429"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6dd" stop-opacity=".9"/><stop offset="1" stop-color="#fff6dd" stop-opacity="0"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a2118" stop-opacity=".28"/></radialGradient>
<g id="sk"><rect x="0" y="60" width="50" height="140" fill="#7f93ab"/><rect x="60" y="20" width="40" height="180" fill="#6f859f"/><rect x="110" y="80" width="60" height="120" fill="#8ea1b7"/><rect x="180" y="40" width="36" height="160" fill="#7389a3"/><rect x="226" y="95" width="64" height="105" fill="#92a5ba"/><rect x="300" y="10" width="44" height="190" fill="#6b819b"/><rect x="354" y="70" width="70" height="130" fill="#8398b0"/></g>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<rect y="640" width="1600" height="260" fill="url(#floor)"/>
<g stroke="#00000014" stroke-width="2"><path d="M0 700H1600M0 770H1600M0 850H1600"/></g>
<rect y="628" width="1600" height="16" fill="#c9c0b2"/>
