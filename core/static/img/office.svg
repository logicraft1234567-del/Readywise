<g><rect x="40" y="560" width="26" height="76" rx="4" fill="#caa57f"/><ellipse cx="53" cy="540" rx="30" ry="42" fill="#4f8a5b"/><ellipse cx="38" cy="525" rx="18" ry="30" fill="#3f7a4d"/><ellipse cx="70" cy="520" rx="16" ry="30" fill="#5f9a69"/></g>
