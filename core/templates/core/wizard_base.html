{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ReadyWise{% endblock %}</title><link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}"><link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
<script src="{% static 'js/theme.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'css/app.css' %}"><link rel="stylesheet" href="{% static 'css/wizard.css' %}"><link rel="stylesheet" href="{% static 'css/brand.css' %}"><script src="{% static 'vendor/lucide/lucide.min.js' %}"></script><script src="{% static 'js/voice.js' %}" defer></script><script src="{% static 'js/dictate.js' %}" defer></script></head>
<body class="wz-body">
<div class="wz" id="wz"><noscript><p style="padding:2rem">Please turn on JavaScript to use the guided set-up, or <a href="{% url 'profile' %}">fill in your profile here</a>.</p></noscript></div>
<form id="wz-form" method="post" enctype="multipart/form-data" style="display:none">{% csrf_token %}<div id="wz-hidden"></div>{% block files %}{% endblock %}</form>
{{ cfg|json_script:"wz-cfg" }}
<script src="{% static 'js/shatter.js' %}"></script>
<script src="{% static 'js/wizard.js' %}"></script>
<script>const c=JSON.parse(document.getElementById("wz-cfg").textContent);c.root="#wz";c.form="#wz-form";c.logo="{% static 'img/mark.svg' %}";c.home="{% url 'dashboard' %}";RWWizard(c);if(window.lucide){const root=document.getElementById("wz");let t;const run=()=>{mo.disconnect();lucide.createIcons({attrs:{"stroke-width":1.75}});mo.observe(root,{childList:true,subtree:true})};const mo=new MutationObserver(()=>{clearTimeout(t);t=setTimeout(run,30)});run()}</script>
</body></html>
