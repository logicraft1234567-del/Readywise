{% extends 'core/app_base.html' %}{% load static %}{% block content %}<div class="page max-w-3xl"><form method="post" class="glass p-8">{% csrf_token %}<h1 class="text-3xl">Create an interviewer</h1>
<label class="l">Avatar</label><div class="flex flex-wrap gap-3">{% for a in avatars %}<label class="cursor-pointer"><input type="radio" name="image" value="{{ a }}" class="peer hidden" {% if forloop.first %}checked{% endif %}><img src="{% static a %}" class="w-16 h-16 rounded-2xl object-cover border-2 border-transparent peer-checked:border-blue-600" alt=""></label>{% endfor %}</div>
<div class="grid g2"><div><label class="l">Name</label><input class="field" name="name" required placeholder="Michael"></div><div><label class="l">Position</label><input class="field" name="position" required placeholder="Senior Backend Engineering Manager"></div>
<div><label class="l">Personality</label><input class="field" name="personality" placeholder="Formal, exacting, system-design focused"></div><div><label class="l">Speaking style</label><input class="field" name="style" value="Formal"></div>
<div><label class="l">Expertise</label><input class="field" name="expertise" placeholder="Python, databases, distributed systems"></div><div><label class="l">Difficulty</label><select class="field" name="difficulty">{% for k,l in levels %}<option value="{{ k }}">{{ l }}</option>{% endfor %}</select></div>
<div><label class="l">Voice type</label><select class="field" name="gender"><option value="m">Male</option><option value="f">Female</option></select></div><div><label class="l">Voice</label><select class="field" name="voice_name">{% for v in voices %}<option>{{ v }}</option>{% endfor %}</select></div><div><label class="l">Objective</label><input class="field" name="objectives" placeholder="Stress-test architecture thinking"></div></div>
<label class="l">Responsibilities</label><textarea class="field" name="responsibilities" rows="3" required></textarea><label class="l">Areas this interviewer can see in your memory</label><div class="flex flex-wrap gap-3">{% for k,l in cats %}<label class="flex gap-2 items-center"><input type="checkbox" name="focus" value="{{ k }}">{{ l }}</label>{% endfor %}</div><label class="l">Question themes <small>(one per line, used as inspiration, never read out)</small></label><textarea class="field" name="question_bank" rows="4"></textarea><label class="l">What this interviewer listens for <small>(scoring rubric)</small></label><textarea class="field" name="rubric" rows="2"></textarea><button class="btn solid mt-6">Save interviewer</button></form></div>{% endblock %}
