<div id="{{ fid }}" class="film" role="dialog" aria-modal="true" aria-label="{{ flabel }}" aria-hidden="true" tabindex="-1" data-cta="{% url 'register' %}">
 <div class="st-stage"><div class="st-cam"></div><canvas class="st-fx"></canvas><div class="st-leak"></div><div class="st-vig"></div><div class="st-grain"></div><div class="st-flash"></div></div>
 <a class="st-skip" href="#" onclick="return false">Esc to close</a>
 <button class="st-ib st-close" type="button" data-close aria-label="Close"><i data-lucide="x" width="17"></i></button>
 <div class="st-ui"><button class="st-ib" type="button" data-pp aria-label="Play or pause"><i data-lucide="pause" width="16"></i></button><div class="st-segs" role="group" aria-label="Chapters"></div><button class="st-ib" type="button" data-snd aria-label="Sound on or off" aria-pressed="true"><i data-lucide="volume-2" width="16"></i></button><button class="st-ib" type="button" data-vo aria-label="Narration on or off" aria-pressed="false"><i data-lucide="mic" width="16"></i></button></div>
</div>
