{% load static %}<div class="glass card text-center"><img class="avatar" src="{% static i.image %}" alt="{{ i.name }}"><h3 class="text-lg mt-3">{{ i.name }}</h3><div class="text-sm font-semibold text-blue-600">{{ i.position }}</div><p class="text-xs mt-2" style="color:var(--mut)">{{ i.personality }}</p><span class="chip mt-3">{{ i.get_difficulty_display }}</span></div>
